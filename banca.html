<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banca Portfólio</title>
    <link rel="stylesheet" href="banca.css">
    <link rel="icon" type="image/png" sizes="32x32" href="fotos/logo thay.png">
    <link rel="shortcut icon" href="fotos/logo thay.png" type="image/png">
</head>
<body>

    <header class="topo">
        <div class="logo"><img src="fotos/logo bordo.png" alt="Thaylla logo"></div>
        <nav aria-label="Navegação principal">
            <a href="index.html">Início</a>
            <a href="index.html#infos1">Sobre</a>
            <a href="projetos.html">Projetos</a>
            <a href="certificado.html">Certificado</a>
            <a href="banca.html" aria-current="page">Banca Portfólio</a>
        </nav>
    </header>

    <main>
        <section class="intro">
            <h1>Banca Portfólio</h1>
            <p>Atividades do 2º e do 3º ano, reunidas por área de conhecimento. Escolha uma matéria para ver os trabalhos.</p>
        </section>

        <section class="materias" aria-label="Matérias">
            <article class="card-materia">
                <img src="banca/capa-hum-banca.png" alt="Humanas">
                <div class="card-rodape">
                    <span>Humanas</span>
                    <a href="#" class="btn-materia" data-materia="humanas">Ver mais</a>
                </div>
            </article>

            <article class="card-materia">
                <img src="banca/capa-lin-banca.png" alt="Linguagens">
                <div class="card-rodape">
                    <span>Linguagens</span>
                    <a href="#" class="btn-materia" data-materia="linguagens">Ver mais</a>
                </div>
            </article>

            <article class="card-materia">
                <img src="banca/capa-nat-banca.png" alt="Natureza">
                <div class="card-rodape">
                    <span>Natureza</span>
                    <a href="#" class="btn-materia" data-materia="natureza">Ver mais</a>
                </div>
            </article>

            <article class="card-materia">
                <img src="banca/capa-tec-banca.png" alt="Técnico">
                <div class="card-rodape">
                    <span>Técnico</span>
                    <a href="#" class="btn-materia" data-materia="tecnico">Ver mais</a>
                </div>
            </article>

            <article class="card-materia">
                <img src="banca/capa-mat-banca.png" alt="Matemática">
                <div class="card-rodape">
                    <span>Matemática</span>
                    <a href="#" class="btn-materia" data-materia="matematica">Ver mais</a>
                </div>
            </article>
        </section>
    </main>

    <!-- Painel que mostra as atividades da matéria, sem sair da página -->
    <div class="painel" id="painel" hidden>
        <div class="painel-caixa" role="dialog" aria-modal="true" aria-labelledby="painel-titulo">
            <div class="painel-topo">
                <h3 id="painel-titulo"></h3>
                <button class="painel-fechar" aria-label="Fechar">&times;</button>
            </div>
            <div class="painel-corpo" id="painel-corpo"></div>
        </div>
    </div>

    <script src="banca.js"></script>
</body>
</html>
